# Phpanta's own site, rendered by Phpanta and served by GitHub Pages at /phpanta/.
#
# The framework's suite runs first, so a push that breaks the framework does not publish a site
# built on it. Then the site is built the way any site is — tsc, the stylesheet, the manifest, the
# bundled prod tree — and exported: every page rendered by its own controller into a static file,
# every address moved under /phpanta/, and the export fails on any link it did not write — a page
# or an anchor on one.

name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          # pdo_sqlite by name: DatabaseTest skips without it, and a skip passes.
          extensions: dom, intl, openssl, zlib, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit
      # The hello-world example under its own app — the files the README quotes, asked what they answer.
      - run: npm run hello:test

      - run: npm ci
      - run: npm run check
      # The mirrored enums in assets/ts/model/ against the PHP they repeat.
      - run: npm test
      - run: npm run site:prod
      # The site's own suite, once its manifest has been built: every page in every language.
      - run: npm run site:test
      - run: npm run site:export

      - uses: actions/configure-pages@v6
      # Dotfiles kept, as before v4 left them out: the export writes .nojekyll and its own
      # .phpanta-export marker (docs/tooling.md), and the upload should be the export as written.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
